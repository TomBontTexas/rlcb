<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investigator Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --navy:#1f3d8c; --navy-2:#2c4fa6; --line:#8fa3cf; --rule:#b9c4de;
  --paper:#e9edf5; --box:#fbfcff; --ink:#1b2130; --muted:#5b6580;
  --hot:rgba(44,79,166,.07); --hot-line:#2c4fa6;
  --ok:#2d7a4c; --warn:#a86400; --err:#b3261e; --chip:#e3e9f7;
  --band-ink:#fff; --shadow:0 1px 2px rgba(20,30,60,.08),0 6px 24px rgba(20,30,60,.08);
  --head:'Josefin Sans',system-ui,sans-serif; --body:'EB Garamond',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#2a4aa3; --navy-2:#3a5fc0; --line:#3e4d73; --rule:#34405e;
    --paper:#10141d; --box:#171d2a; --ink:#e5e9f3; --muted:#9aa5c0;
    --hot:rgba(120,150,235,.10); --hot-line:#7f9df0; --chip:#222b40;
    --ok:#5cc28a; --warn:#e0a24a; --err:#f07a70; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --navy:#2a4aa3; --navy-2:#3a5fc0; --line:#3e4d73; --rule:#34405e;
  --paper:#10141d; --box:#171d2a; --ink:#e5e9f3; --muted:#9aa5c0;
  --hot:rgba(120,150,235,.10); --hot-line:#7f9df0; --chip:#222b40;
  --ok:#5cc28a; --warn:#e0a24a; --err:#f07a70; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:12px 16px 60px}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-family:var(--head);font-weight:700;letter-spacing:.06em;color:var(--navy);font-size:22px;text-transform:uppercase;line-height:1}
.brand small{display:block;font-weight:400;font-size:12px;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:4px;background:var(--box);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{border:0;background:transparent;padding:7px 18px;border-radius:7px;font-family:var(--head);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--box);padding:6px 11px;border-radius:8px;cursor:pointer;font-family:var(--head);font-size:13px;letter-spacing:.04em}
.btn:hover{border-color:var(--hot-line)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{font-family:var(--head);font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--err)}

/* ---------- sheet ---------- */
.page{display:none}
.page.on{display:grid}
.front{grid-template-columns:repeat(12,1fr);gap:12px}
.back{grid-template-columns:repeat(12,1fr);gap:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:12px}
.box{background:var(--box);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.band{margin:0;background:var(--navy);color:var(--band-ink);font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:17px;padding:7px 12px 5px;display:flex;align-items:center;gap:8px}
.band .ico{opacity:.85;font-size:15px}
.band .hint{margin-left:auto;font-size:11px;letter-spacing:.06em;opacity:.75;font-weight:400}
.bd{padding:8px 12px 10px}
.hot{cursor:pointer;transition:background .12s, outline-color .12s;outline:2px solid transparent;outline-offset:-2px}
.hot:hover{background:var(--hot);outline-color:var(--hot-line)}
.hot:focus-visible{outline-color:var(--hot-line)}
.fl{display:flex;align-items:flex-end;gap:8px;min-height:30px;border-bottom:1px solid var(--rule);padding:3px 2px}
.fl>label{font-family:var(--head);font-size:13px;color:var(--muted);white-space:nowrap;padding-bottom:1px}
.fl>.v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl.hot{border-radius:3px}
.muted{color:var(--muted)}
.ph{color:var(--muted);font-style:italic;opacity:.8}
.fh{display:inline-flex;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fh b{font-weight:600;min-width:2ch;text-align:right;font-size:18px}
.fh i{font-style:normal;color:var(--muted);min-width:2ch;font-size:15px}
.fh .sl{color:var(--muted)}
.sub{display:block;font-family:var(--head);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;margin-top:-2px}
.portrait{aspect-ratio:3/3.6;display:flex;align-items:center;justify-content:center;background:var(--paper);margin:10px;border:1px solid var(--line);border-radius:3px;overflow:hidden;color:var(--muted);font-family:var(--head);font-size:13px;text-align:center}
.portrait img{width:100%;height:100%;object-fit:cover}
.logo{font-family:var(--head);text-align:center;padding:10px 8px 0;color:var(--navy);line-height:1.05}
.logo .l1{font-size:28px;letter-spacing:.08em;font-weight:700}
.logo .l2{font-size:13px;letter-spacing:.2em;color:var(--muted)}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;border-bottom:1px solid var(--rule);padding:4px 2px;min-height:32px}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.boost .nm::after{content:"●";color:var(--navy-2);font-size:9px;vertical-align:super;margin-left:3px}
.chars .row .nm b{font-family:var(--head);font-weight:700}
.tick{display:inline-flex;align-items:center;gap:6px;padding:3px 0}
.box input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy)}
.adv-list{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.adv-list .fl{min-height:28px}
.tag{display:inline-block;font-family:var(--head);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.dis{background:transparent;border:1px solid var(--err);color:var(--err)}
.weap{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:end;border-bottom:1px solid var(--rule);padding:4px 2px;min-height:34px}
.wrow .col{text-align:center;font-variant-numeric:tabular-nums;min-width:44px}
.wrow .col .sub{text-align:center}
.spells{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.srow{display:flex;gap:10px;align-items:end;border-bottom:1px solid var(--rule);padding:4px 2px;min-height:32px}
.srow .ord{width:40px;text-align:center;font-family:var(--head);color:var(--muted)}
.srow .ord .sub{text-align:center}
.srow .snm{flex:1;min-width:0}
.srow .snm .sub{text-align:left}
.srow .box2{width:15px;height:15px;border:1.5px solid var(--ink);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;flex:none;margin-bottom:3px}
.lines{min-height:120px;white-space:pre-wrap;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--rule) 29px,var(--rule) 30px);line-height:30px;padding-top:0}
.lines.tall{min-height:300px}
.lines.med{min-height:240px}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.crow{display:flex;gap:10px;align-items:end;border-bottom:1px solid var(--rule);padding:4px 2px;min-height:34px}
.crow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .ss{font-family:var(--head);font-size:11px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.crow .ss .on{color:var(--ink);font-weight:700}
.problems{position:absolute;top:6px;right:8px;width:10px;height:10px;border-radius:50%}
.problems.err{background:var(--err)} .problems.warn{background:var(--warn)}
.dmg .tick{font-size:18px;display:flex}
.dmg .tick.off{opacity:.35;text-decoration:line-through}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;font-family:var(--head);letter-spacing:.02em}

/* ---------- modal ---------- */
dialog{border:0;padding:0;border-radius:12px;background:var(--box);color:var(--ink);width:min(900px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(12,18,35,.55)}
.mh{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.mh h3{margin:0;font-family:var(--head);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:17px;flex:1}
.mh .x{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--head)}
.mb{padding:14px 16px 20px;overflow:auto}
.mb h4{font-family:var(--head);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--navy-2);margin:18px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.mb h4:first-child{margin-top:0}
.rules{background:var(--paper);border-left:3px solid var(--navy-2);padding:8px 12px;border-radius:0 6px 6px 0;font-size:15.5px;margin:6px 0 10px}
.rules ul{margin:4px 0;padding-left:20px}
.rules p{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>span{font-family:var(--head);font-size:12px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.fld input,.fld select,.fld textarea,.mb input[type=text],.mb input[type=number],.mb select,.mb textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px;width:100%}
.mb input[type=number]{width:74px}
.mb textarea{min-height:90px;resize:vertical}
.mb input[type=checkbox],.mb input[type=radio]{accent-color:var(--navy-2);width:16px;height:16px;vertical-align:-2px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;margin-bottom:6px;background:var(--box)}
.opt.sel{border-color:var(--navy-2);background:var(--hot)}
.opt.no{opacity:.55}
.opt .t{font-weight:600}
.opt .d{font-size:15px;color:var(--muted)}
.why{font-family:var(--head);font-size:11px;color:var(--err);letter-spacing:.03em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.card{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--box);text-align:left}
.card:hover{border-color:var(--hot-line)}
.card.sel{border-color:var(--navy-2);background:var(--hot);box-shadow:inset 0 0 0 1px var(--navy-2)}
.card .t{font-weight:600;font-size:17px}
.card .d{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--head);font-size:12px;padding:3px 9px;border-radius:99px;background:var(--chip);border:1px solid transparent;cursor:default;white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.need{border-color:var(--err);color:var(--err)}
button.chip{cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:4px 6px}
.tbl td{border-bottom:1px solid var(--rule);padding:4px 6px;vertical-align:middle}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.picked td:first-child{font-weight:600}
.tbl .desc{font-size:14px;color:var(--muted)}
.msg{font-size:15px;padding:3px 0 3px 22px;position:relative}
.msg::before{position:absolute;left:0;top:3px;font-family:var(--head);font-weight:700}
.msg.ok::before{content:"✓";color:var(--ok)}
.msg.warn::before{content:"!";color:var(--warn);left:5px}
.msg.err::before{content:"✕";color:var(--err)}
.msg.warn{color:var(--warn)} .msg.err{color:var(--err)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-family:var(--head);font-size:16px}
.stepper output{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:19px}
.charrow{display:grid;grid-template-columns:130px auto 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.charrow .nm{font-family:var(--head);font-weight:600}
.charrow .mean{font-size:14.5px;color:var(--muted)}
.big{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.dice{display:inline-flex;gap:6px;align-items:center}
.die{width:34px;height:34px;border-radius:7px;border:1.5px solid var(--navy-2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--head)}
.spellord{margin-bottom:10px}
.spellord summary{font-family:var(--head);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;cursor:pointer;color:var(--navy-2);padding:6px 0}
.row-flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small{font-size:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .adv-list,.weap,.spells,.contacts{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .charrow{grid-template-columns:1fr auto}
  .charrow .mean{grid-column:1/-1}
  .portrait{max-width:220px;margin:10px auto}
}
@media print{
  body{background:#fff;font-size:12px}
  .top,.foot{display:none}
  .wrap{max-width:none;padding:0}
  .page{display:grid!important;break-after:page}
  .box{box-shadow:none}
  .problems{display:none}
  .band{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Rivers of London<small>Investigator Sheet · v<span class="app-ver"></span> · click any section to fill it in</small></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-front" aria-selected="true" data-tab="front">Front</button>
      <button class="tab" role="tab" id="tab-back" aria-selected="false" data-tab="back">Back</button>
    </div>
    <div class="tools">
      <button class="btn" data-open="checklist" id="statusBtn">Checklist</button>
      <button class="btn" data-open="develop" id="devBtn">Development</button>
      <button class="btn" data-open="options">Rules options</button>
      <button class="btn" data-open="roster">Characters</button>
      <button class="btn" onclick="window.print()">Print</button>
    </div>
  </div>
  <main>
    <section class="page front on" id="page-front" role="tabpanel" aria-labelledby="tab-front"></section>
    <section class="page back" id="page-back" role="tabpanel" aria-labelledby="tab-back"></section>
  </main>
  <p class="foot">Version <span class="app-ver"></span> · Built from the Rivers of London RPG investigator sheet (© 2025 Chaosium Inc.; Rivers of London © 2011–2025 Ben Aaronovitch). Personal, non-commercial use. Page numbers refer to the core rulebook.</p>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="mh"><h3 id="dlgTitle"></h3><button class="x" data-close>Done</button></div>
  <div class="mb" id="dlgBody"></div>
</dialog>
<input type="file" id="fileIn" accept="image/*" class="sr">
<input type="file" id="jsonIn" accept="application/json,.json" class="sr">

<script>
/* =====================================================================
   RULES DATA (Rivers of London: the Roleplaying Game, Chaosium 2025)
   ===================================================================== */

/* App version — bump this for every release and tag the commit v<APP_VERSION>. Format: MAJOR.MINOR.PATCH, two digits each. */
const APP_VERSION = '0.02.00';
document.querySelectorAll('.app-ver').forEach(el=>el.textContent=APP_VERSION);

const CHARS = ['STR','CON','DEX','INT','POW'];
const CHAR_NAMES = {STR:'Strength',CON:'Constitution',DEX:'Dexterity',INT:'Intelligence',POW:'Power'};
const CHAR_DESC = {
  STR:'Muscle power: lifting, clinging on.',
  CON:'Health, vigour and vitality: shrugging off wounds, poisons and disease.',
  DEX:'Speed and manual manipulation. Highest DEX may act first in combat.',
  INT:'Learning, memory, analysis and factual knowledge. Sets your own-language skill.',
  POW:'Force of will and aptitude for magic. Magic points = POW ÷ 5.'
};
const CHAR_MEAN = {
  STR:[[0,'enfeebled, bed-bound'],[10,'puny and frail'],[30,'weak'],[50,'average human strength'],[90,'one of the strongest people you’ve met'],[99,'world class; human maximum']],
  CON:[[0,'dead'],[10,'weak health, prone to illness'],[30,'always the first to catch a cold'],[50,'average healthy human'],[90,'shrugs off colds; hardy and hale'],[99,'iron constitution; human maximum']],
  DEX:[[0,'unable to perform physical tasks'],[10,'slow and uncoordinated'],[30,'clumsy; last picked for teams'],[50,'average human dexterity'],[90,'fast and nimble (acrobat, great dancer)'],[99,'world-class athlete; human maximum']],
  INT:[[0,'unable to comprehend or communicate'],[10,'slow learner'],[30,'learning takes time; books aren’t your thing'],[50,'average human intellect'],[90,'quick-witted; multiple languages or theorems'],[99,'genius; human maximum']],
  POW:[[0,'zombie-like, no will'],[10,'weak-willed, easily dominated'],[30,'credulous, easily swayed'],[50,'average human'],[90,'strong-willed; high magical potential'],[100,'iron will; strong link to the unseen']]
};
function meaning(c,v){let m='';for(const [t,s] of CHAR_MEAN[c]) if(v>=t) m=s; return m;}

const COMMON = ['Athletics','Drive','Navigate','Observation','Read Person','Research','Sense Vestigia','Social','Stealth'];
const COMBAT = ['Fighting','Firearms'];
const SKILL_DESC = {
  'Athletics':'Climbing, jumping, swimming, throwing (STR÷5 m). Breaks falls (half damage).',
  'Drive':'Cars and light trucks; losing or tailing someone. Unusual vehicles at a penalty die unless occupational.',
  'Navigate':'Finding your way, reading maps, cartography. The Knowledge gives a bonus die in your area.',
  'Observation':'Mundane senses: spotting clues, hidden doors, ambushers, eavesdropping. Opposes Stealth.',
  'Read Person':'Judging motives and intent, spotting lies. Opposes Social (deception) and Disguise.',
  'Research':'Finding information in libraries, archives or online (non-verbal information gathering).',
  'Sense Vestigia':'Detecting the imprint magic leaves on places and things. Free 60% with the Magic skill.',
  'Social':'Persuasion, intimidation, seduction, flattery, deception. Opposed by Read Person or POW.',
  'Stealth':'Moving quietly and hiding. Difficulty set by the opponent’s Observation.',
  'Fighting':'Melee (hand-to-hand) combat and instinctive dodging. Consider a training style (boxing, martial art…).',
  'Firearms':'All guns, plus bows and crossbows. Rare in the UK: give a reason for 60%.',
  'Accounting':'Reading accounts, spotting siphoned funds, bribes and hidden finances.',
  'Animal Handling':'Commanding and training animals (not riding animals — use Ride).',
  'Appraise':'Estimating value, materials, age and workmanship; detecting forgeries.',
  'Art/Craft':'One specialisation at 60% plus two others at 30%. Make, repair, identify or fake works.',
  'Computer Use':'Programming, data analysis, hacking secure systems. Everyday computer use needs no roll.',
  'Demolitions':'Setting and defusing explosives; placing charges for best effect.',
  'Disguise':'Posing as someone else or concealing your identity. Opposed by Observation / Read Person.',
  'Diving':'Scuba diving, equipment use and underwater navigation.',
  'History':'Recalling facts about places, people and eras; identifying old techniques.',
  'Languages':'One language at 60% plus two others at 30%. 30% = transactional, 50% = fluent, 70% = passes as native.',
  'Law':'Laws, precedents and court procedure. For police, it “buys” the authority of the job.',
  'Locksmith':'Picking and repairing locks, hot-wiring cars, bypassing ordinary alarms.',
  'Magic':'Casting and sensing spells. Requires the Magical advantage. Also boosts Sense Vestigia to 60% free.',
  'Mechanical Repair':'Fixing or building machines; simple household locks. Companion to Tech.',
  'Medicine':'Diagnosis and treatment; can save a mortally wounded character within one hour.',
  'Occult':'Folklore, occult traditions, paraphernalia, grimoires and codes.',
  'Pilot Aircraft':'Flying aircraft; a roll is always needed to land.',
  'Pilot Boat':'Handling boats and ships in difficult conditions.',
  'Read Lips':'Following a conversation by sight alone (Observation can do this at a penalty die).',

const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function merge(base,src){ // deep merge: keeps new default fields AND every key from the save (incl. maps like adj, pkg.pts, advField)
  if(!isObj(src)) return base;
  for(const k of Object.keys(src)){
    const s=src[k]; if(s===undefined) continue;
    base[k]=(isObj(base[k])&&isObj(s))?merge(base[k],s):s;
  }
  return base;
}
// Saves made before the merge fix lost skill improvements; rebuild them from the development history.
function repairFromLog(C){
  const sum={};
  for(const l of (C.dev&&C.dev.log)||[]){ const u=l.u||{}; if((u.t==='raise'||u.t==='new')&&u.k) sum[u.k]=(sum[u.k]||0)+(+u.amt||0); }
  let fixed=[];
  for(const [k,v] of Object.entries(sum)){ if((+C.adj[k]||0)<v){ C.adj[k]=v; fixed.push(k); } }
  return fixed;
}

function occReqRec(){
  const o=occ(); if(!o) return {r:[],c:[]};
  if(o.custom){
    const parse=str=>str.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*\((.*)\)$/); if(m){const s=m[1].trim().replace(/^Language$/,'Languages'); return {s, sp:SPECIALISED.includes(s)?m[2].trim():null};} return {s:x.replace(/^Language$/,'Languages')};});
    return {r:parse(S.info.occReq||''),c:parse(S.info.occRec||'')};
  }
  return {r:o.r,c:o.c};
}
function occName(){ const o=occ(); if(!o) return ''; return o.custom?(S.info.occName||'Custom occupation'):o.n; }
function pickLimit(){ return (S.pkg.id==='experienced'&&S.pkg.mode==='newskill')?7:6; }
const hasMagicPick = () => S.picks.some(p=>p.skill==='Magic');

function computeSkills(){
  const M=new Map();
  const put=(key,cat,base,skill,src)=>{ const cur=M.get(key); if(cur){ if(base>cur.base){cur.base=base;} cur.src.push(src); } else M.set(key,{key,cat,base,skill,src:[src]}); };
  COMMON.forEach(k=>put(k,'common',30,k,'base'));
  COMBAT.forEach(k=>put(k,'combat',30,k,'base'));
  const INT=S.ch.INT;
  // own languages
  if(S.lang.own) put(skillKey('Languages',S.lang.own),'expert',Math.max(INT,60),'Languages','own');
  if(S.lang.mode!=='none'&&S.lang.second) put(skillKey('Languages',S.lang.second),'expert',S.lang.mode==='equal'?Math.max(INT,60):Math.max(Math.floor(INT/2),30),'Languages','bilingual');
  for(const p of S.picks){
    if(COMMON.includes(p.skill)||COMBAT.includes(p.skill)){ put(p.skill,COMMON.includes(p.skill)?'common':'combat',60,p.skill,'pick'); continue; }
    if(p.skill==='Magic'){ put('Magic','expert',S.pkg.id==='spellcaster'?70:60,'Magic','pick'); put('Sense Vestigia','common',60,'Sense Vestigia','magic'); continue; }
    if(p.skill==='Medicine'&&S.info.occ==='nurse'&&S.nurse.split){ put('Medicine','expert',40,'Medicine','pick'); if(S.nurse.skill) put(skillKey(S.nurse.skill,S.nurse.spec),'expert',40,S.nurse.skill,'pick'); continue; }
    if(SPECIALISED.includes(p.skill)){ const sp=p.specs||['','','']; put(skillKey(p.skill,sp[0]),'expert',60,p.skill,'pick'); [1,2].forEach(i=>{ if(sp[i]) put(skillKey(p.skill,sp[i]),'expert',30,p.skill,'pick30'); }); continue; }
    put(p.skill,'expert',60,p.skill,'pick');
  }
  if(isFae()) put('Sense Vestigia','common',60,'Sense Vestigia','fae');
  for(const x of S.extras){ put(skillKey(x.skill,x.spec),'expert',0,x.skill,'extra'); }
  const out=[];
  for(const e of M.values()){
    e.pkg=S.pkg.id&&S.pkg.mode==='points'?(+S.pkg.pts[e.key]||0):0;
    e.adjv=+S.adj[e.key]||0;
    e.total=Math.max(0,e.base+e.pkg+e.adjv);
    e.half=Math.floor(e.total/2);
    e.picked=e.src.some(s=>s==='pick'||s==='pick30'||s==='magic');
    out.push(e);
  }
  return out;
}
function skillVal(key){ const e=computeSkills().find(x=>x.key===key); return e?e.total:(COMMON.includes(key)||COMBAT.includes(key)?30:0); }
function pkgEligible(key){
  if(!S.pkg.id) return false;
  const P=PKG.find(p=>p.id===S.pkg.id); if(P.any) return true;
  const o=occ(); if(o&&o.anyRec) return true;
  const {r,c}=occReqRec(); const base=baseSkillOf(key);
  if([...r,...c].some(t=>t.s===base)) return true;
  if(r.some(t=>t.any)&&!COMMON.includes(key)&&!COMBAT.includes(key)) return S.picks.some(p=>skillKey(p.skill,(p.specs||[])[0])===key||p.skill===key);

}

function advCheck(a){

  if(a.pre.skill && skillVal(a.pre.skill[0])<a.pre.skill[1]) why.push(a.pre.skill[0]+' '+a.pre.skill[1]+'%+');

function validate(){

  if(!o) add('occ','err','Choose an occupation.');

    if(o.adult&&S.info.age&&+S.info.age<18) add('occ','warn',o.n+' cannot normally be chosen by an investigator under 18.');
  }
  if(!S.info.name) add('occ','warn','Give your investigator a name.');
  if(!S.info.age) add('occ','warn','Choose an age.');
  // 2 characteristics
  const lo=S.opt.wide?20:30, hi=S.opt.wide?90:80;

  if(slots>2) add('adv','err','Too many advantages: '+slots+' of 2 choices used (major advantages count as two).');
  else if(slots<2) add('adv','warn','You may choose '+(2-slots)+' more advantage choice'+(2-slots>1?'s':'')+'.');
  else add('adv','ok','Two advantage choices used.');
  S.adv.forEach(id=>{ const a=ADV.find(x=>x.id===id); const w=advCheck(a); if(w.length) add('adv','err',a.n+' needs '+w.join(', ')+'.'); if(a.field&&!S.advField[id]) add('adv','warn',a.n+': specify '+a.field.toLowerCase()+(id==='connected'?' (can be decided later in play)':'')+'.'); });

  if(hasAdv('rich')&&af!=='Rich') add('back','warn','You took Rich — set affluence to Rich.');
  if(hasAdv('wealthy')&&af!=='Wealthy') add('back','warn','You took Wealthy — set affluence to Wealthy.');
  if(af!=='Average'&&af!=='Wealthy'&&af!=='Rich') add('back','warn','Non-average affluence should be agreed with the GM.');
  // 4 skills
  const lim=pickLimit();
  if(inPlay()) add('skills','ok','In play: '+S.dev.pts+' development point'+(S.dev.pts===1?'':'s')+' banked.');
  if(S.picks.length!==lim) add('skills',S.picks.length>lim?'err':'warn',S.picks.length+' of '+lim+' starting skills chosen.');
  else add('skills','ok',lim+' starting skills chosen.');
  if(o){ const {r}=occReqRec(); r.forEach(t=>{ if(!tokenSatisfied(t)) add('skills','err','Required skill missing: '+tokLabel(t)+'.'); }); }

     <div><div class="fld"><span>Recommended skills</span></div><div class="chips">${c.map(t=>`<span class="chip ${tokenSatisfied(t)?'ok':''}">${esc(tokLabel(t))}</span>`).join('')}${o.anyRec?'<span class="chip">+ any skill from their service</span>':''}</div></div>

 affluence(){

 },
 chars(){

  const unlock={STR:'Damage Bonus, Natural Toughness (with CON)',CON:'Natural Toughness (with STR)',DEX:'Speedy, Fast Reactions, Signature Weapon/Firearm',INT:'Magical (with POW), The Knowledge',POW:'Magical (with INT), Steadfast'};

  ${rulesBox(`<p>Share <b>280 points</b> among the five characteristics, each <b>${lo}–${hi}</b>${S.opt.free?' (free allocation on)':', in blocks of 10'}. Average human = 50. Half values are calculated for you (round down). <b>60+</b> unlocks advantages: ${CHARS.map(c=>`${c} → ${unlock[c]}`).join('; ')}.</p>`)}
  <div class="row-flex" style="justify-content:space-between"><div><span class="muted">Points used</span> <span class="big" style="color:${tot===280?'var(--ok)':'var(--err)'}">${tot}</span><span class="muted"> / 280</span></div>
   <div class="row-flex small"><span class="muted">Presets:</span>
    <button class="btn sm" data-a="preset" data-x="50,50,60,60,60">Fairly average</button>
    <button class="btn sm" data-a="preset" data-x="30,50,60,60,80">Strengths &amp; weaknesses</button>
    <button class="btn sm" data-a="preset" data-x="30,30,60,80,80">Extremes</button>

    <button class="btn sm" data-a="preset" data-x="70,50,40,60,60">Nafeesa (example)</button>
   </div></div>
  ${CHARS.map(c=>{ const v=+S.ch[c]; return `<div class="charrow"><div><div class="nm">${c} · ${CHAR_NAMES[c]}</div><div class="small muted">${esc(CHAR_DESC[c])}</div></div>
    <div class="stepper"><button data-a="chr" data-x="${c}" data-y="-${step}" ${v-step<lo?'disabled':''} aria-label="Lower ${c}">−</button><output>${v}</output><button data-a="chr" data-x="${c}" data-y="${step}" ${v+step>hi?'disabled':''} aria-label="Raise ${c}">+</button><span class="muted small" style="margin-left:6px">half ${half(v)}</span></div>
    <div class="mean">${esc(meaning(c,v))}</div></div>`; }).join('')}
  <p class="small muted">Presets fill STR, CON, DEX, INT, POW in that order — then move points around.</p>
  <h4>Status</h4>${msgs('chars')}`];
 },
 supp(){
  const m=mov(), L=luckStart(), mp=mpStart();
  return ['Supplemental Info',`
  <h4>Movement (MOV)</h4>
  ${rulesBox(`<p>Default MOV 8 (Speedy 9; Slow-Footed 5). Move up to 5× MOV metres per combat round.${S.opt.ageMov?' Age rule on: −1 per decade from your 40s.':''}</p>`)}

  <h4>Luck</h4>
  ${isFae()?rulesBox(`<p>Fae Luck equals POW (<b>${S.ch.POW}</b>) and refreshes every day at a set time you choose.</p>`)+fld('Luck refreshes at',txt('opt.refresh','','e.g. midnight, sunrise, changing of the guard'))
   :rulesBox('<p>Roll <b>2D10 + 50</b> for starting Luck. It rises and falls in play; update “Starting” after each session.</p>')+`
  <div class="row-flex"><button class="btn primary" data-a="rollLuck">Roll 2D10 + 50</button>${S.luck.dice?`<span class="dice"><span class="die">${S.luck.dice[0]}</span><span class="die">${S.luck.dice[1]}</span> + 50 =</span>`:''}
   <label class="fld" style="flex-direction:row;align-items:center;gap:6px"><span>Starting</span><input type="number" data-b="luck.start" data-t="n" data-r value="${esc(S.luck.start??'')}"></label></div>`}
  <div class="row-flex" style="margin-top:8px"><label class="fld" style="flex-direction:row;align-items:center;gap:6px"><span>Current Luck</span><input type="number" data-b="luck.cur" data-t="n" value="${esc(S.luck.cur??'')}" placeholder="${esc(L??'')}"></label></div>
  <h4>Magic points</h4>
  ${isFae()?'<p class="muted">Fae investigators have no magic points; they spend Luck on their affinity instead.</p>':rulesBox(`<p>Starting magic points = POW ÷ 5 (<b>${Math.floor(S.ch.POW/5)}</b>) + 1 per mastered spell (<b>${masteredCount()}</b>) = <b>${mp}</b>. Spell cost = its order${S.dis==='exhausting'?' +1 (Magic is Exhausting)':''}.</p>`)+`
  <label class="fld" style="flex-direction:row;align-items:center;gap:6px"><span>Current magic points</span><input type="number" data-b="mp.cur" data-t="n" value="${esc(S.mp.cur??'')}" placeholder="${esc(mp??'')}"></label>`}`];
 },
 adv(){
  const slots=advSlots();
  const advHtml=ADV.map(a=>{ const on=hasAdv(a.id); const why=advCheck(a); const full=!on&&(slots+(a.major?2:1)>2);
    return `<label class="opt ${on?'sel':''} ${(!on&&(why.length||full))?'no':''}"><input type="checkbox" data-a="toggleAdv" data-x="${a.id}" ${on?'checked':''}><div style="flex:1"><div class="t">${a.n}${a.major?' <span class="tag">major · 2 choices</span>':''}${a.house?' <span class="tag">house rule</span>':''}</div><div class="d">${esc(a.d)}</div>
      <div class="small muted">Prerequisite: ${Object.keys(a.pre).length?[...CHARS.filter(c=>a.pre[c]).map(c=>c+' '+a.pre[c]),a.pre.skill?a.pre.skill[0]+' '+a.pre.skill[1]+'%':null].filter(Boolean).join(', '):'none'}</div>
      ${why.length?`<div class="why">Not met: ${esc(why.join(', '))}</div>`:''}
      ${on&&a.field?`<div style="margin-top:6px">${fld(a.field,`<input type="text" data-b="advField.${a.id}" value="${esc(S.advField[a.id]||'')}">`)}</div>`:''}</div></label>`; }).join('');
  const pk=S.pkg.id;
  const disHtml=DIS.map(d=>{ const why=disCheck(d); return `<label class="opt ${S.dis===d.id?'sel':''} ${why.length&&S.dis!==d.id?'no':''}"><input type="radio" name="dis" data-a="setDis" data-x="${d.id}" ${S.dis===d.id?'checked':''}><div><div class="t">${d.n}</div><div class="d">${esc(d.d)}</div>${why.length?`<div class="why">${esc(why.join(', '))}</div>`:''}</div></label>`; }).join('');
  return ['Step 3 · Advantages',`
  ${rulesBox('<p>Choose up to <b>two</b> advantages. <b>Major</b> advantages (Magical, Rich) count as both. You must meet each prerequisite — skill prerequisites use your current skill values, so pick skills first if needed (Signature Weapon/Firearm, The Knowledge).</p>')}
  <p><b>${slots}</b> of 2 choices used.</p>
  ${advHtml}
  <h4>Experience package (optional, GM’s permission)</h4>
  ${rulesBox('<p>For more experienced investigators. Most packages give <b>60 extra skill points</b> for required/recommended skills (no skill above 80% this way). Every package <b>requires one disadvantage</b>.</p>')}
  <label class="opt ${!pk?'sel':''}"><input type="radio" name="pkg" data-a="setPkg" data-x="" ${!pk?'checked':''}><div><div class="t">No package</div><div class="d">Standard character creation.</div></div></label>
  ${PKG.map(p=>`<label class="opt ${pk===p.id?'sel':''}"><input type="radio" name="pkg" data-a="setPkg" data-x="${p.id}" ${pk===p.id?'checked':''}><div style="flex:1"><div class="t">${p.n}</div><div class="d">${esc(p.d)}${p.occ?' Occupation: '+esc(occById(p.occ).n)+'.':''}</div>
   ${pk==='experienced'&&p.id==='experienced'?`<div class="row-flex small" style="margin-top:6px"><label><input type="radio" name="pmode" data-b="pkg.mode" value="points" ${S.pkg.mode==='points'?'checked':''}> 60 points on any skills</label><label><input type="radio" name="pmode" data-b="pkg.mode" value="newskill" ${S.pkg.mode==='newskill'?'checked':''}> one extra new skill at 60% (7 picks)</label></div>`:''}</div></label>`).join('')}
  <h4>Disadvantage ${pk?'(required — choose one)':'(only with a package)'}</h4>
  ${pk||S.dis?`<label class="opt ${!S.dis?'sel':''}"><input type="radio" name="dis" data-a="setDis" data-x="" ${!S.dis?'checked':''}><div><div class="t">None</div></div></label>${disHtml}`:'<p class="muted small">Choose an experience package to unlock disadvantages.</p>'}
  <h4>Status</h4>${msgs('adv')}`];
 },
 skills(){
  const sk=computeSkills(); const lim=pickLimit(); const o=occ(); const {r,c}=occReqRec();
  const pickSet=new Set(S.picks.map(p=>p.skill));
  const P=S.pkg.id?PKG.find(p=>p.id===S.pkg.id):null; const pts=S.pkg.id&&S.pkg.mode==='points';
  const spent=sk.reduce((a,e)=>a+e.pkg,0);
  const reqChips=r.map(t=>{ const ok=tokenSatisfied(t); const canAdd=!ok&&!t.any&&!(t.alt&&false); return ok?`<span class="chip ok">✓ ${esc(tokLabel(t))}</span>`:(t.any?`<span class="chip need">${esc(tokLabel(t))}</span>`:`<button class="chip need" data-a="addTok" data-x='${esc(JSON.stringify(t))}'>+ ${esc(tokLabel(t))}</button>`); }).join('');
  const recChips=c.map(t=>tokenSatisfied(t)?`<span class="chip ok">✓ ${esc(tokLabel(t))}</span>`:`<button class="chip" data-a="addTok" data-x='${esc(JSON.stringify(t))}'>+ ${esc(tokLabel(t))}</button>`).join('');
  const ccRow=k=>{ const e=sk.find(x=>x.key===k); const on=pickSet.has(k); const viaMagic=k==='Sense Vestigia'&&(hasMagicPick()||isFae());
    return `<tr class="${e.picked?'picked':''}"><td><label><input type="checkbox" data-a="pick" data-x="${k}" ${on?'checked':''} ${!on&&(S.picks.length>=lim||viaMagic)?'disabled':''}> ${k}</label>${viaMagic?' <span class="tag">free 60%</span>':''}${on&&viaMagic?' <span class="why">already free — pick something else</span>':''}<div class="desc">${esc(SKILL_DESC[k])}</div></td>
    <td class="n">${e.base}</td>${pts?`<td class="n">${pkgEligible(k)?`<input type="number" min="0" max="60" step="5" data-b="pkg.pts.${k}" data-t="n" data-r value="${e.pkg||''}">`:'<span class="muted">—</span>'}</td>`:''}
    <td class="n"><input type="number" step="1" data-b="adj.${k}" data-t="n" data-r value="${e.adjv||''}" title="Improvements gained in play"></td><td class="n"><b>${e.total}</b>/${e.half}</td></tr>`; };
  const expertPicks=S.picks.map((p,i)=>({p,i})).filter(({p})=>!COMMON.includes(p.skill)&&!COMBAT.includes(p.skill));
  const pickEditor=({p,i})=>{
    let inner='';
    if(SPECIALISED.includes(p.skill)){
      const sp=p.specs||['','',''];
      const labs=['First — 60%','Second — 30%','Third — 30%'];
      inner=`<div class="grid3" style="margin-top:6px">${[0,1,2].map(j=>fld(labs[j],`<input type="text" list="dl-${p.skill.replace(/\W/g,'')}" data-b="picks.${i}.specs.${j}" data-r value="${esc(sp[j]||'')}" placeholder="${j?'choose or type':'required'}">`)).join('')}</div>`;
    }
    if(p.skill==='Medicine'&&S.info.occ==='nurse'){
      inner=`<label class="small" style="display:block;margin-top:6px"><input type="checkbox" data-b="nurse.split" ${S.nurse.split?'checked':''}> Take Medicine at 40% plus another expert skill at 40%</label>
      ${S.nurse.split?`<div class="grid2" style="margin-top:6px">${fld('Second expert skill (40%)',`<select data-b="nurse.skill"><option value="">—</option>${EXPERT.filter(x=>x!=='Medicine'&&x!=='Magic').map(x=>`<option ${S.nurse.skill===x?'selected':''}>${x}</option>`).join('')}</select>`)}${SPECIALISED.includes(S.nurse.skill)?fld('Specialisation',`<input type="text" list="dl-${S.nurse.skill.replace(/\W/g,'')}" data-b="nurse.spec" data-r value="${esc(S.nurse.spec)}">`):''}</div>`:''}`;
    }
    const val=p.skill==='Magic'?(S.pkg.id==='spellcaster'?70:60):(p.skill==='Medicine'&&S.nurse.split&&S.info.occ==='nurse'?40:60);
    return `<div class="opt sel" style="display:block"><div class="row-flex" style="justify-content:space-between"><div><span class="t">${esc(p.skill)}</span>${customSkill(p.skill)?' <span class="tag">custom</span>':''} <span class="muted small">${val}%${SPECIALISED.includes(p.skill)?' / 30% / 30%':''}</span></div><button class="btn sm" data-a="unpick" data-x="${i}">Remove</button></div><div class="d small">${esc(skillDesc(p.skill))}</div>${inner}</div>`;
  };
  const addable=allExpert().filter(x=>!(pickSet.has(x)&&!SPECIALISED.includes(x)));
  const usedKeys=new Set(sk.map(e=>e.key));
  const customList=S.customSkills.map((c,i)=>`<div class="opt" style="align-items:center"><div style="flex:1"><div class="t">${esc(c.n)} <span class="tag">custom</span></div><div class="d small">${esc(c.d||'No description')} · learned in play at ½ ${esc(c.c)}</div></div>${usedKeys.has(c.n)?'<span class="small muted">in use</span>':`<button class="btn sm" data-a="delCustom" data-x="${i}">Delete</button>`}</div>`).join('');
  const expertTable=sk.filter(e=>e.cat==='expert').sort((a,b)=>a.key.localeCompare(b.key)).map(e=>`<tr class="${e.picked?'picked':''}"><td>${esc(e.key)} <span class="muted small">${e.src.map(s=>({own:'own language',bilingual:'bilingual',pick:'starting skill',pick30:'secondary',extra:'added'}[s]||'')).filter(Boolean).join(', ')}</span></td><td class="n">${e.base}</td>${pts?`<td class="n">${pkgEligible(e.key)?`<input type="number" min="0" max="60" step="5" data-b="pkg.pts.${e.key}" data-t="n" data-r value="${e.pkg||''}">`:'<span class="muted">—</span>'}</td>`:''}<td class="n"><input type="number" data-b="adj.${e.key}" data-t="n" data-r value="${e.adjv||''}"></td><td class="n"><b>${e.total}</b>/${e.half}</td><td>${e.src.includes('extra')?`<button class="btn sm" data-a="rmExtra" data-x="${esc(e.key)}">×</button>`:''}</td></tr>`).join('');
  const datalists=SPECIALISED.map(s=>`<datalist id="dl-${s.replace(/\W/g,'')}">${SPEC[s].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('');
  return ['Step 4 · Skills',`${datalists}
  ${rulesBox(`<ul>
   <li>Choose <b>${lim} starting skills</b> and boost each to <b>60%</b>. Include all <b>required</b> skills, then any recommended or other skills.</li>
   <li>Unchosen common and combat skills stay at <b>30%</b>; unchosen expert skills are <b>0%</b> (you can’t use them).</li>
   <li><b>Art/Craft, Science and Languages</b>: one pick = one specialisation at 60% plus two others at 30%.</li>
   <li><b>Magic</b> needs the Magical advantage and gives <b>Sense Vestigia 60%</b> free.</li>
   <li>Your <b>own language</b> is free at INT or 60% (whichever is higher). A bilingual upbringing gives a second language free (same value, or half INT/30% if less fluent).</li>
   ${P?`<li><b>${esc(P.n)} package:</b> ${pts?`spend <b>60 points</b> on ${P.any?'any':'required/recommended'} skills (the “Pkg” column), max 80% each.`:'one extra starting skill at 60% (7 picks).'}${P.spell?' Magic starts at 70%.':''}</li>`:''}
   <li>To improve skills after play, use <a href="#" data-a="open" data-x="develop">Development</a>. The “Adj” column is only for manual GM adjustments.</li></ul>`)}
  <div class="row-flex" style="justify-content:space-between"><div><span class="big" style="color:${S.picks.length===lim?'var(--ok)':S.picks.length>lim?'var(--err)':'var(--ink)'}">${S.picks.length}</span><span class="muted"> / ${lim} starting skills chosen</span></div>${pts?`<div><span class="big" style="color:${spent===60?'var(--ok)':spent>60?'var(--err)':'var(--ink)'}">${spent}</span><span class="muted"> / 60 package points</span></div>`:''}</div>
  ${o?`<div style="margin:8px 0"><div class="fld"><span>Required for ${esc(occName())}</span></div><div class="chips">${reqChips||'<span class="muted small">none</span>'}</div></div>
       <div style="margin:8px 0"><div class="fld"><span>Recommended</span></div><div class="chips">${recChips}${o.anyRec?'<span class="chip">+ any skill from their service</span>':''}</div></div>`:'<p class="msg warn">Choose an occupation first to see required and recommended skills. <button class="btn sm" data-a="open" data-x="occupation">Choose…</button></p>'}
  <h4 data-f="common">Common skills</h4>
  <table class="tbl"><tr><th>Skill</th><th class="n">Base</th>${pts?'<th class="n">Pkg</th>':''}<th class="n">Adj</th><th class="n">Full/Half</th></tr>${COMMON.map(ccRow).join('')}</table>
  <h4 data-f="combat">Combat skills</h4>
  <table class="tbl"><tr><th>Skill</th><th class="n">Base</th>${pts?'<th class="n">Pkg</th>':''}<th class="n">Adj</th><th class="n">Full/Half</th></tr>${COMBAT.map(ccRow).join('')}</table>
  <h4 data-f="expert">Expert skills — starting picks</h4>
  ${expertPicks.map(pickEditor).join('')||'<p class="muted small">No expert skills chosen yet.</p>'}
  <div class="row-flex" style="margin-top:6px"><select id="addExpert" style="width:auto"><option value="">Add an expert skill…</option>${addable.map(x=>{ const dis=x==='Magic'&&(!hasAdv('magical')||isFae()); return `<option value="${x}" ${dis?'disabled':''}>${x}${dis?' (needs Magical)':''}</option>`; }).join('')}</select>
   <button class="btn primary" data-a="addExpert" ${S.picks.length>=lim?'disabled':''}>Add as starting skill</button>
   <button class="btn" data-a="addExtra" title="Adds the skill at 0% — for package points or skills learned in play">Add at 0% (package / in play)</button></div>
  <h4 data-f="custom">Custom expert skill</h4>
  ${rulesBox('<p>With the GM’s approval you can create an expert skill that isn’t in the book (p. 321), e.g. <i>Anthropology</i>, <i>Heraldry</i>, <i>Brewing</i>. First check whether an existing skill or specialisation already covers it. Agree with the GM what it does, what opposes it, and what Regular and Hard tasks look like.</p>')}
  ${customList}
  <div class="grid3">
   ${fld('Skill name','<input type="text" id="cusName" placeholder="e.g. Heraldry">')}
   ${fld('Characteristic (for learning it later)',`<select id="cusChar">${CHARS.map(c=>`<option ${c==='INT'?'selected':''}>${c}</option>`).join('')}</select>`)}
   ${fld('Short description','<input type="text" id="cusDesc" placeholder="What the skill covers">')}
  </div>
  <div class="row-flex" style="margin-top:8px"><button class="btn primary" data-a="addCustom" data-x="pick" ${S.picks.length>=lim?'disabled':''}>Create &amp; add as starting skill (60%)</button><button class="btn" data-a="addCustom" data-x="extra">Create &amp; add at 0%</button><button class="btn" data-a="addCustom" data-x="">Create only</button></div>

   ${fld('Own language (mother tongue)',`<input type="text" list="dl-Languages" data-b="lang.own" data-r value="${esc(S.lang.own)}">`)}

   ${S.lang.mode!=='none'?fld('Second language',`<input type="text" list="dl-Languages" data-b="lang.second" data-r value="${esc(S.lang.second)}">`):''}
  </div>
  <p class="small muted">Newtonian practitioners don’t need Latin to cast spells, though Nightingale teaches it. More languages mean taking the Languages skill.</p>

 weapon(i){

 },
 spells(){

  const caster=hasMagicPick();

  const list=o=>SPELLS.filter(s=>s.o===o).map(s=>{ const k=s.n in known; const ok=prereqOK(s,known); const cannot=!k&&!ok;
    return `<div class="opt ${k?'sel':''} ${cannot?'no':''}"><input type="checkbox" data-a="toggleSpell" data-x="${esc(s.n)}" ${k?'checked':''} aria-label="Know ${esc(s.n)}"><div style="flex:1"><div class="row-flex" style="justify-content:space-between"><span class="t">${esc(s.n)}</span><span class="small muted">Order ${s.o} · cost ${spellCost(s)} MP</span></div><div class="d">${esc(s.d)}</div><div class="small muted">Prerequisite: ${esc(preText(s))}</div>${!ok?`<div class="why">Prerequisite not met</div>`:''}${k?`<label class="small"><input type="checkbox" data-a="masterSpell" data-x="${esc(s.n)}" ${known[s.n]?'checked':''}> Mastered (bonus die to cast; +1 magic point)</label>`:''}</div></div>`; }).join('');
  return ['Magic Spells',`
  ${!caster?rulesBox('<p><b>Your investigator can’t cast spells yet.</b> Take the <b>Magical</b> advantage (INT 60 & POW 60) and choose <b>Magic</b> as a starting skill. You can still browse the spells.</p>'):''}
  ${rulesBox(`<ul>
   <li>Starting practitioners know <b>${sp?'three first-order spells (one mastered) and two second-order spells (one mastered)':'two first-order spells (one mastered) and one second-order spell (unmastered)'}</b>.</li>
   <li><b>Newtonian apprentice</b> (trained at the Folly): Werelight is one first-order spell, and it’s mastered. Impello is the usual second spell.</li>
   <li><b>Hedge wizard</b> (self-taught or taught elsewhere): any spells; master one first-order spell.</li>
   <li>You must know a spell’s prerequisites. Mastered spells gain a bonus die to cast and +1 magic point each. Later, you must master two spells of one order before mastering the next.</li></ul>`)}
  <div class="row-flex"><label class="opt ${S.magicType==='apprentice'?'sel':''}" style="margin:0"><input type="radio" name="mt" data-b="magicType" value="apprentice" ${S.magicType==='apprentice'?'checked':''}><div><div class="t">Newtonian apprentice</div><div class="d">Trained by Nightingale and Varvara at the Folly.</div></div></label>
   <label class="opt ${S.magicType==='hedge'?'sel':''}" style="margin:0"><input type="radio" name="mt" data-b="magicType" value="hedge" ${S.magicType==='hedge'?'checked':''}><div><div class="t">Hedge wizard</div><div class="d">Discovered it spontaneously or learned from another tradition.</div></div></label>
   ${S.magicType==='apprentice'?'<button class="btn" data-a="apprenticeStart">Set up Werelight (mastered)</button>':''}</div>

 },
 damage(){

  ${[['hurt','Hurt'],['bloodied','Bloodied'],['down','Down'],['impaired','Impaired']].map(([k,l])=>`<label class="opt ${S.dmg[k]?'sel':''}"><input type="checkbox" data-b="dmg.${k}" ${S.dmg[k]?'checked':''} ${k==='hurt'&&S.dis==='frail'?'disabled':''}><div class="t">${l}</div></label>`).join('')}`];

 contacts(){

  </table>`];
 },
 signare(){

  ${rulesBox(`<p>Every practitioner’s magic leaves a signature: a sound, a smell or another sensation. Roll <b>1D100</b> for each of the three columns of <b>Table 10: Signare</b> (rulebook p. 165), or pick the entries you like, and type them in below. Then <b>keep two and discard the third</b>. Or invent your own. If trained by someone with a known signare, add one element of theirs as a third element.${S.opt.kind==='quiet'?' <b>Quiet People</b> add a momentary blast of heat or the smell of the pigsty as a third element.':''}</p>`)}
  ${!hasMagicPick()&&S.opt.kind!=='quiet'?'<p class="msg warn">Only investigators with the Magic skill have a signare.</p>':''}
  <div class="row-flex"><button class="btn primary" data-a="sigRollAll">Roll all three</button>${[0,1,2].map(c=>`<button class="btn" data-a="sigRoll" data-x="${c}">Roll ${SIG_COLS[c].toLowerCase()}</button>`).join('')}</div>
  <div class="grid3" style="margin-top:10px">${[0,1,2].map(c=>`<div class="opt ${S.sig.keep[c]&&(p[c]||S.sig.el[c])?'sel':''}" style="display:block">
    <label class="row-flex"><input type="checkbox" data-a="sigKeep" data-x="${c}" ${S.sig.keep[c]?'checked':''}> <b>${SIG_COLS[c]}</b> ${p[c]?`<span class="muted small">rolled <b>${p[c]}</b></span>`:''}</label>
    <input type="text" data-b="sig.el.${c}" value="${esc(S.sig.el[c]||'')}" placeholder="${p[c]?'Entry '+p[c]+' from Table 10':'Type the '+SIG_COLS[c].toLowerCase()}" style="margin-top:6px"></div>`).join('')}</div>

  <p><b>Signare:</b> ${esc(sigText())||'<span class="muted">—</span>'} ${S.sig.keep.filter(Boolean).length!==2&&!S.sig.text?'<span class="msg warn" style="display:inline">Keep exactly two of the three.</span>':''}</p>`];
 },
 backstory(){

  <h4>Childhood</h4>${BACKQ.child.map(radio).join('')}

  ${b.brush==='yes'?`<div class="grid2" style="margin-top:8px">${BACKQ.brush.map(text).join('')}</div>`:''}
  <h4>Affluence, friends & family</h4>

 equip(){

  const civ=o&&o.id!=='police';
  return ['Step 6 · Equipment',`
  ${rulesBox(`<p>You automatically own whatever is reasonable for your occupation and anything that fits your living standard (<b>${esc(S.info.affluence)}</b>: ${esc(AFFLUENCE.find(a=>a.n===S.info.affluence).maj)}). Extra purchases need the GM’s OK. List only notable or useful items; put weapons in the Weapons box.</p>${civ?'<p><b>Folly consultants</b> swear an oath and carry a consultant’s card: access to crime scenes and interviews, but no police powers.</p>':''}`)}
  ${o&&o.e?`<p class="small"><b>Suggested for ${esc(occName())}:</b> ${esc(o.e)}</p><div class="row-flex"><button class="btn" data-a="occEquip">Add suggested equipment</button>${o.weapons?'<button class="btn" data-a="occWeapons">Add occupational weapons</button>':''}${civ?'<button class="btn" data-a="addCard">Add Folly consultant’s card</button>':''}</div>`:''}
  <textarea data-b="equip" style="min-height:260px;margin-top:10px">${esc(S.equip)}</textarea>
  <div class="row-flex" style="margin-top:8px"><button class="btn" data-a="open" data-x="weapon" data-y="0">Edit weapons →</button></div>`];
 },
 cases(){

 },
 develop(){
  const D=S.dev, P=D.phase, sk=computeSkills();
  const fmt=n=>(Math.round(n*2)/2).toString().replace('.5','½').replace(/(^|-)0½/,'$1½');
  const can=c=>P&&D.pts>=c;
  let spend='';
  if(P){
    const raised=new Set(P.raised);
    const rows=[...sk].filter(e=>e.cat!=='expert'||e.total>0).sort((a,b)=>(a.cat==='expert')-(b.cat==='expert')||a.key.localeCompare(b.key)).map(e=>{
      const st=devStep(e.total); const done=raised.has(e.key);
      const why=done?'raised this phase':!st?'at maximum (99%)':'';
      return `<tr><td>${esc(e.key)}</td><td class="n"><b>${e.total}</b>/${e.half}</td><td class="n">${why?`<span class="muted small">${why}</span>`:`<button class="btn sm" data-a="devRaise" data-x="${esc(e.key)}" ${can(1)?'':'disabled'}>→ ${st.to}% · 1 DP</button>`}</td>
        <td class="n">${!why&&e.total<80?`<button class="btn sm" data-a="devHalf" data-x="${esc(e.key)}" ${can(.5)?'':'disabled'}>→ ${Math.min(80,e.total+5)}% · ½ DP</button>`:''}</td></tr>`; }).join('');
    const knownKeys=new Set(sk.map(e=>e.key));
    const newOpts=allExpert().filter(x=>x!=='Magic'&&(SPECIALISED.includes(x)||!knownKeys.has(x)||sk.find(e=>e.key===x).total===0)).map(x=>{ const s=newSkillStart(x); return `<option value="${x}">${x} — starts at ${s.v}% (${s.label})</option>`; }).join('');
    const learnable=hasMagicPick()?SPELLS.map(s=>({s,why:canLearn(s)})):[];
    const masterable=hasMagicPick()?S.spells.map(s=>({s,why:canMaster(s)})):[];
    const advs=ADV.filter(a=>!hasAdv(a.id)).map(a=>{ const w=advCheck(a); const c=a.major?10:5; return `<option value="${a.id}" ${w.length?'disabled':''}>${a.n} — ${c} DP${w.length?' (needs '+w.join(', ')+')':''}</option>`; }).join('');
    spend=`
    <h4>Raise a skill</h4>
    <p class="small muted">1 DP = one skill +10% (max 80%), or two skills +5% each (½ DP each). 80%+ goes up 5% (max 90%); 90%+ goes up 1% (max 99%). Each skill can be raised only once per phase.</p>
    <table class="tbl"><tr><th>Skill</th><th class="n">Now</th><th class="n">Raise</th><th class="n">Half step</th></tr>${rows}</table>
    <h4>Learn a new skill · 1 DP</h4>
    <p class="small muted">Starts at half the related characteristic (Table 4, p. 117). For Art/Craft, Science or Languages, name the specialisation. Need a skill that isn’t in the book? <a href="#" data-a="open" data-x="skills" data-y="">Create a custom skill</a> in the Skills section first.</p>
    <div class="row-flex"><select id="devNew" style="width:auto"><option value="">Choose a skill…</option>${newOpts}</select><input type="text" id="devSpec" list="dl-all" placeholder="Specialisation (if needed)" style="width:220px"><button class="btn primary" data-a="devNew" ${can(1)?'':'disabled'}>Learn</button></div>
    <datalist id="dl-all">${[...SPEC['Art/Craft'],...SPEC.Science,...SPEC.Languages].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    ${hasMagicPick()?`<h4>Spells · 1 DP each, one learned and one mastered per phase</h4>
    <p class="small muted">To learn a spell you need two spells of the order below it, and you can never know more spells of one order than of any lower order. To master a spell you need two mastered spells of the order below. Each mastered spell gives +1 magic point.</p>
    <div class="row-flex"><select id="devLearn" style="width:auto" ${P.learned?'disabled':''}><option value="">${P.learned?'Already learned a spell this phase':'Learn a spell…'}</option>${learnable.map(({s,why})=>`<option value="${esc(s.n)}" ${why?'disabled':''}>${esc(s.n)} (order ${s.o})${why?' — '+esc(why):''}</option>`).join('')}</select><button class="btn primary" data-a="devLearn" ${can(1)&&!P.learned?'':'disabled'}>Learn</button></div>
    <div class="row-flex" style="margin-top:6px"><select id="devMaster" style="width:auto" ${P.mastered?'disabled':''}><option value="">${P.mastered?'Already mastered a spell this phase':'Master a spell…'}</option>${masterable.map(({s,why})=>`<option value="${esc(s.n)}" ${why?'disabled':''}>${esc(s.n)}${why?' — '+esc(why):''}</option>`).join('')}</select><button class="btn primary" data-a="devMaster" ${can(1)&&!P.mastered?'':'disabled'}>Master</button></div>`:''}
    <h4>Buy an advantage · 5 DP (major 10 DP)</h4>
    <div class="row-flex"><select id="devAdv" style="width:auto"><option value="">Choose an advantage…</option>${advs}</select><button class="btn primary" data-a="devAdv" ${can(5)?'':'disabled'}>Buy</button></div>
    <h4>Also this phase</h4>
    <p class="small">Update your <a href="#" data-a="open" data-x="backstory">backstory</a>, review <a href="#" data-a="open" data-x="affluence">affluence</a> if your finances changed, recover from impairment, and update starting Luck in <a href="#" data-a="open" data-x="supp">Supplemental Info</a>.</p>`;
  }
  const closed=new Set(D.log.filter(l=>l.u&&l.u.t==='end').map(phaseOfEnd));
  const log=D.log.map((l,i)=>{
    const u=l.u||{};
    if(u.t==='start'){ const n=l.ph, editing=P&&P.n===n;
      return `<tr style="background:var(--hot)"><td colspan="3"><b>Development phase ${n}</b>${editing?(P.editing?' <span class="status warn">editing</span>':' <span class="status warn">open</span>'):''}</td>
      <td class="n">${closed.has(n)&&!P?`<button class="btn sm" data-a="devEditPhase" data-x="${n}" title="Reopen this phase to change what was spent in it">Edit phase</button>`:''}</td></tr>`; }
    if(u.t==='end') return '';
    const canDel=!(l.dp>0&&D.pts<l.dp);
    const ex=u.t==='new'&&S.extras.find(e=>e.dev&&skillKey(e.skill,e.spec)===u.k);
    const ren=ex&&SPECIALISED.includes(ex.skill);
    return `<tr><td class="small muted">${l.ph?'':'between phases'}</td><td>${esc(l.t)}</td><td class="n ${l.dp>0?'':'muted'}">${l.dp>0?'+':''}${l.dp?fmt(l.dp):''}</td>
    <td class="n" style="white-space:nowrap">${ren?`<button class="btn sm" data-a="devRename" data-x="${i}" title="Change the specialisation (e.g. which language)">✎</button> `:''}<button class="btn sm" data-a="devDel" data-x="${i}" ${canDel?'':'disabled title="Those points have already been spent"'} title="Remove this entry and refund its points" aria-label="Remove entry">×</button></td></tr>`; }).join('');
  return ['Development',`
  ${rulesBox('<p>Rivers of London uses <b>development points (DP)</b>, not experience points (p. 120). The GM normally awards <b>1 DP per session</b> (more or fewer to suit the group), plus at most 1 DP for training between case files. You spend them in a <b>development phase</b> at the end of a case file or campaign chapter.</p>')}
  <div class="row-flex" style="justify-content:space-between">
    <div>${(()=>{ const T=devTotals(); return `<span class="big">${fmt(D.pts)}</span> <span class="muted">banked</span> &nbsp;·&nbsp; <span class="big">${fmt(T.earned)}</span> <span class="muted">earned in total</span> &nbsp;·&nbsp; <span class="big">${fmt(T.spent)}</span> <span class="muted">spent</span>`; })()}</div>
    <div class="row-flex"><input type="text" id="devWhy" placeholder="Reason (e.g. Session 3)" style="width:190px"><button class="btn primary" data-a="devAward" data-x="1">+1 DP</button><button class="btn" data-a="devAward" data-x="2">+2</button><button class="btn" data-a="devRemove" ${D.pts>=1?'':'disabled'} title="Take away 1 development point">−1 DP</button><button class="btn" data-a="devAward" data-x="1" data-y="Training between cases">+1 training</button></div>
  </div>
  <h4>Development phase</h4>
  ${P?(P.editing?`<div class="row-flex" style="justify-content:space-between"><span><b>Editing phase ${P.n}.</b> <span class="muted">Anything you spend now is filed under phase ${P.n}. Remove mistakes with × in the History below.</span></span><button class="btn primary" data-a="devEnd">Finish editing</button></div>`
     :`<div class="row-flex" style="justify-content:space-between"><span><b>Phase ${P.n} in progress.</b> <span class="muted">Unspent points carry over.</span></span><button class="btn" data-a="devEnd">End phase</button></div>`)
     :`<div class="row-flex"><button class="btn primary" data-a="devStart" ${D.pts>0?'':'disabled'}>Start development phase</button><span class="small muted">${D.pts>0?'Start one at the end of a case file to spend your points.':'Award some points first.'}</span></div>`}
  ${spend}

function d(n){ return 1+Math.floor(Math.random()*n); }
function addToken(t){
  if(pickLimitReached()) return alert('You already have '+pickLimit()+' starting skills. Remove one first.');
  if(t.s==='Magic'&&!hasAdv('magical')) return alert('Magic requires the Magical advantage.');
  const p={skill:t.s}; if(SPECIALISED.includes(t.s)) p.specs=[t.sp||'','',''];
  if(!SPECIALISED.includes(t.s)&&S.picks.some(x=>x.skill===t.s)) return;
  S.picks.push(p);
}
const pickLimitReached=()=>S.picks.length>=pickLimit();
function devSpend(c){ if(!S.dev.phase){ alert('Start a development phase first.'); return false; } if(S.dev.pts<c){ alert('Not enough development points.'); return false; } S.dev.pts-=c; return true; }
function devLog(t,dp,u){
  const P=S.dev.phase; const e={t,dp,u,ph:P?P.n:null,id:++S.dev.seq};
  if(P&&P.editing){ // file it inside the phase being edited, just before that phase's “ended” line
    const i=S.dev.log.findIndex(l=>l.u&&l.u.t==='end'&&(l.ph===P.n||(l.u.p&&l.u.p.n===P.n)));
    if(i>=0){ S.dev.log.splice(i,0,e); return; }
  }
  S.dev.log.push(e);
}
const phaseOfEnd = l => l.ph ?? (l.u&&l.u.p&&l.u.p.n);
function devRemoveEntry(i,quiet){
  const L=S.dev.log, l=L[i]; if(!l) return false; const u=l.u||{}, P=S.dev.phase;
  if(u.t==='start'||u.t==='end') return false;
  if(l.dp>0&&S.dev.pts<l.dp){ alert('Those points have already been spent — remove what they were spent on first.'); return false; }
  const deps=[];
  L.forEach((x,j)=>{ if(j<=i||!x.u) return;
    if(u.t==='new'&&x.u.t==='raise'&&x.u.k===u.k) deps.push(j);
    if(u.t==='learn'&&x.u.t==='master'&&x.u.n===u.n) deps.push(j); });
  if(deps.length&&!quiet&&!confirm('This will also remove '+deps.length+' later entr'+(deps.length>1?'ies that depend':'y that depends')+' on it:\n\n'+deps.map(j=>'• '+L[j].t).join('\n')+'\n\nContinue?')) return false;
  deps.reverse().forEach(j=>devRemoveEntry(j,true));
  const unraise=k=>{ if(P&&P.n===l.ph){ const x=P.raised.lastIndexOf(k); if(x>=0) P.raised.splice(x,1); } };
  const unadj=(k,a)=>{ S.adj[k]=(+S.adj[k]||0)-a; if(!S.adj[k]) delete S.adj[k]; };
  if(u.t==='raise'){ unadj(u.k,u.amt); unraise(u.k); }
  else if(u.t==='new'){ S.extras=S.extras.filter(e=>!(e.dev&&skillKey(e.skill,e.spec)===u.k)); unadj(u.k,u.amt); unraise(u.k); }
  else if(u.t==='learn'){ S.spells=S.spells.filter(s=>s.n!==u.n); if(P&&P.n===l.ph) P.learned=false; }
  else if(u.t==='master'){ const s=S.spells.find(x=>x.n===u.n); if(s) s.m=false; if(P&&P.n===l.ph) P.mastered=false; }
  else if(u.t==='adv'){ S.adv=S.adv.filter(a=>a!==u.id); S.dev.advBought=S.dev.advBought.filter(a=>a!==u.id); }
  S.dev.pts-=l.dp; L.splice(i,1); return true;
}
const ACT={
 open:(x,y)=>open(x,y!=null&&y!==''?+y:null),
 setOcc:x=>{ S.info.occ=x; },
 occEquip:()=>{ const o=occ(); if(o&&o.e&&!S.equip.includes(o.e)) S.equip=(S.equip?S.equip+'\n':'')+o.e; },
 occWeapons:()=>{ const o=occ(); (o.weapons||[]).forEach(n=>{ if(S.weapons.some(w=>w.n===n)) return; const i=S.weapons.findIndex(w=>!w.n); if(i<0) return; const W=WEAPONS.find(w=>w.n===n); S.weapons[i]={n:W.n,sk:W.sk,dm:W.dm,rg:W.rg,melee:!!W.melee,thrown:!!W.thrown,sig:false,note:W.note||''}; }); },
 addCard:()=>{ if(!S.equip.includes('Folly consultant')) S.equip=(S.equip?S.equip+'\n':'')+'Folly consultant’s card (non-disclosure agreement signed)'; },

 rollLuck:()=>{ const a=d(10),b=d(10); S.luck.dice=[a,b]; S.luck.start=50+a+b; S.luck.cur=null; },

   else{ const a=ADV.find(z=>z.id===x); if(advSlots()+(a.major?2:1)>2){ alert('That would exceed two advantage choices. Remove one first.'); return; } S.adv.push(x);
     if(x==='rich') S.info.affluence='Rich'; if(x==='wealthy'&&S.info.affluence!=='Rich') S.info.affluence='Wealthy'; } },
 setPkg:x=>{ S.pkg.id=x; S.pkg.pts={}; if(!x) S.pkg.mode='points'; const P=PKG.find(p=>p.id===x); if(P&&P.occ&&!S.info.occ) S.info.occ=P.occ; },
 setDis:x=>{ S.dis=x; },
 pick:x=>{ const i=S.picks.findIndex(p=>p.skill===x); if(i>=0) S.picks.splice(i,1); else if(!pickLimitReached()) S.picks.push({skill:x}); },
 unpick:x=>{ S.picks.splice(+x,1); },
 addTok:x=>{ addToken(JSON.parse(x)); },
 addExpert:()=>{ const v=document.getElementById('addExpert').value; if(!v) return; if(v==='Magic'&&!hasAdv('magical')) return alert('Magic requires the Magical advantage.'); if(pickLimitReached()) return; if(!SPECIALISED.includes(v)&&S.picks.some(p=>p.skill===v)) return; const p={skill:v}; if(SPECIALISED.includes(v)) p.specs=['','','']; S.picks.push(p); },
 addExtra:()=>{ const v=document.getElementById('addExpert').value; if(!v||v==='Magic') return alert('Choose a skill (not Magic) from the list first.'); let spec=''; if(SPECIALISED.includes(v)){ spec=prompt('Specialisation for '+v+'?')||''; if(!spec) return; } S.extras.push({skill:v,spec}); },
 addCustom:mode=>{
   const n=document.getElementById('cusName').value.trim().replace(/\s+/g,' ');
   if(!n) return alert('Give the custom skill a name.');

   if(mode==='extra'&&!S.extras.some(e=>e.skill===name)) S.extras.push({skill:name,spec:''}); },
 delCustom:i=>{ S.customSkills.splice(+i,1); },
 rmExtra:x=>{ S.extras=S.extras.filter(e=>skillKey(e.skill,e.spec)!==x); delete S.adj[x]; delete S.pkg.pts[x]; },
 pickWeapon:(i,val)=>{ if(!val) return; let W;
   if(val[0]==='w'){ const w=WEAPONS[+val.slice(1)]; W={n:w.n,sk:w.sk,dm:w.dm,rg:w.rg,melee:!!w.melee,thrown:!!w.thrown,note:w.note||''}; }
   else { const s=spellByName(val.slice(1)); W={n:s.n+' (spell)',sk:s.atk.skill,dm:s.atk.dmg,rg:s.n==='Serra Obscura'?'Touch':'',melee:false,thrown:false,note:s.d}; }
   S.weapons[+i]={...W,sig:false}; },

 toggleSpell:x=>{ const i=S.spells.findIndex(s=>s.n===x); if(i>=0) S.spells.splice(i,1); else S.spells.push({n:x,m:false}); S.spells.sort((a,b)=>spellByName(a.n).o-spellByName(b.n).o); },
 masterSpell:x=>{ const s=S.spells.find(s=>s.n===x); if(s) s.m=!s.m; },
 apprenticeStart:()=>{ let w=S.spells.find(s=>s.n==='Werelight'); if(!w){ S.spells.unshift({n:'Werelight',m:true}); } else w.m=true; S.spells.forEach(s=>{ if(s.n!=='Werelight'&&spellByName(s.n).o===1) s.m=false; }); S.spells.sort((a,b)=>spellByName(a.n).o-spellByName(b.n).o); },

 setKind:x=>{ S.opt.kind=x; if(x!=='human'){ S.adv=S.adv.filter(a=>a!=='magical'); S.picks=S.picks.filter(p=>p.skill!=='Magic'); if(S.dis==='nomagic'||S.dis==='iron') S.dis=''; } if(x==='quiet'&&!S.opt.affinity) S.opt.affinity='Earth'; },
 devAward:(n,why)=>{ const r=why||document.getElementById('devWhy').value.trim()||'GM award'; S.dev.pts+=+n; devLog(r,+n,{t:'award'}); },

 devRename:i=>{ const l=S.dev.log[+i], old=l.u.k; const ex=S.extras.find(e=>e.dev&&skillKey(e.skill,e.spec)===old); if(!ex) return;
   const spec=(prompt('Correct the specialisation for '+ex.skill+' (currently “'+ex.spec+'”):',ex.spec)||'').trim(); if(!spec||spec===ex.spec) return;
   const nk=skillKey(ex.skill,spec); if(skillVal(nk)>0) return alert(nk+' is already on the sheet.');
   ex.spec=spec;
   for(const m of [S.adj,S.pkg.pts]) if(old in m){ m[nk]=(+m[nk]||0)+m[old]; delete m[old]; }
   S.dev.log.forEach(e=>{ if(e.u&&e.u.k===old){ e.u.k=nk; e.t=e.t.split(old).join(nk); } });
   if(S.dev.phase) S.dev.phase.raised=S.dev.phase.raised.map(k=>k===old?nk:k); },
 devRaise:k=>{ const v=skillVal(k); const st=devStep(v); if(!st||!devSpend(1)) return; S.adj[k]=(+S.adj[k]||0)+(st.to-v); S.dev.phase.raised.push(k); devLog(k+' '+v+'% → '+st.to+'%',-1,{t:'raise',k,amt:st.to-v}); },
 devHalf:k=>{ const v=skillVal(k); if(v>=80||!devSpend(.5)) return; const to=Math.min(80,v+5); S.adj[k]=(+S.adj[k]||0)+(to-v); S.dev.phase.raised.push(k); devLog(k+' '+v+'% → '+to+'% (half step)',-.5,{t:'raise',k,amt:to-v}); },

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t===tab)); document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='page-'+tab.dataset.tab)); return; }
  if(e.target.closest('[data-stop]')) return;
  if(e.target.closest('[data-close]')){ dlg.close(); return; }
  const a=e.target.closest('[data-a]');
  if(a&&dlg.contains(a)){
    if(a.tagName==='SELECT') return;
    if(a.tagName==='A') e.preventDefault();
    const fn=ACT[a.dataset.a]; if(!fn) return;
    if(a.dataset.a==='open'){ fn(a.dataset.x,a.dataset.y); return; }
    fn(a.dataset.x,a.dataset.y); refresh(); return;
  }
  const o=e.target.closest('[data-open]');
  if(o&&!dlg.contains(o)){ open(o.dataset.open,o.dataset.i!=null?+o.dataset.i:null,o.dataset.focus); }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('.hot[data-open]')){ e.preventDefault(); e.target.click(); } });
// damage ticks directly on the sheet
document.addEventListener('change',e=>{ const k=e.target.dataset?.dmg; if(k){ S.dmg[k]=e.target.checked; softRefresh(); } });
// bound inputs inside the dialog
dBody.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.b) return;
  if(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT') return;
  let v=el.value; if(el.dataset.t==='n'){ v=el.value===''?null:+el.value; }
  setPath(el.dataset.b,v); softRefresh();
});
dBody.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a==='pickWeapon'){ ACT.pickWeapon(el.dataset.x,el.value); refresh(); return; }
  if(!el.dataset.b) return;
  let v;
  if(el.type==='checkbox') v=el.checked; else if(el.type==='radio'){ if(!el.checked) return; v=el.value; }
  else { v=el.value; if(el.dataset.t==='n') v=el.value===''?null:+el.value; }
  setPath(el.dataset.b,v);
  if(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT') refresh();
  else if(el.dataset.r!==undefined) setTimeout(refresh,0); // let focus move to the next field first; paint() restores it
  else softRefresh();
});
function setPath(path,v){
  const ks=path.split('.'); let o=S;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; }
  const last=ks.at(-1);
  if((path.startsWith('pkg.pts.')||path.startsWith('adj.'))&&(v==null||v===0)){ delete o[last]; return; }
  o[last]=v;
}
dlg.addEventListener('close',()=>renderSheet());
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(); const r=new FileReader();
  r.onload=()=>{ img.onload=()=>{ const max=420; const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); S.info.portrait=c.toDataURL('image/jpeg',.85); refresh(); }; img.src=r.result; };
  r.readAsDataURL(f); e.target.value='';
});
document.getElementById('jsonIn').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{ try{ const c=JSON.parse(t); const id=uid(); roster.chars[id]=merge(blank(),c); repairFromLog(roster.chars[id]); roster.cur=id; S=roster.chars[id]; refresh(); }catch(err){ alert('That file is not a valid character export.'); } });
  e.target.value='';
});

/* init */
try{ const th=localStorage.getItem('rlcb.theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
loadRoster();
renderSheet();
</script>
</body>
</html>
